<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Mehr Couture boutique campaign showcase by Kriyon Media." />
  <meta name="theme-color" content="#ffffff" />
  <title>Boutique Showcase — Kriyon Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="boutique-showcase-page">
  <main>
    <header class="boutique-collab" aria-label="Project collaboration"><strong>Mehr Couture</strong><span>×</span><a href="/">Kriyon Media</a></header>
    <div class="boutique-meta"><h1>Boutique Showcase</h1><p>Engineered by Pixel One</p></div>

    <section class="boutique-stack" aria-labelledby="olive-title">
      <header><span>01</span><h2 id="olive-title">Olive Edit</h2><p>Campaign Stills + Film</p></header>
      <div class="boutique-stack-grid">
        <button type="button" data-lightbox="/assets/angad-showcase/green-01.png"><img src="/assets/angad-showcase/green-01.png" alt="Olive couture campaign portrait" width="2048" height="2048" /></button>
        <button type="button" data-lightbox="/assets/angad-showcase/green-02.png"><img src="/assets/angad-showcase/green-02.png" alt="Olive couture studio portrait" width="2048" height="2048" /></button>
        <button class="boutique-social-card" type="button" data-lightbox="/assets/angad-showcase/ready-social.png"><img src="/assets/angad-showcase/ready-social.png" alt="Mehr Couture ready-to-post social media creative" width="2048" height="2048" /><span>Ready to Post</span></button>
        <button class="boutique-film" type="button" data-video="/assets/angad-showcase/green-film.mp4" data-video-hevc="/assets/angad-showcase/green-film-hevc.mp4" aria-label="Play the Olive campaign film"><video muted autoplay loop playsinline preload="metadata" aria-hidden="true"><source src="/assets/angad-showcase/green-film.mp4" type="video/mp4" /></video><span class="boutique-play"><i>▶</i> Play Film</span></button>
      </div>
    </section>

    <section class="boutique-stack" aria-labelledby="details-title">
      <header><span>02</span><h2 id="details-title">Styled Details</h2><p>Editorial Selects</p></header>
      <div class="boutique-detail-grid">
        <button type="button" data-lightbox="/assets/angad-showcase/detail-corrected-01.png"><img src="/assets/angad-showcase/detail-corrected-01.png" alt="Corrected full-length rust couture editorial portrait" width="2048" height="2048" /></button>
        <button type="button" data-lightbox="/assets/angad-showcase/detail-corrected-02.png"><img src="/assets/angad-showcase/detail-corrected-02.png" alt="Corrected close rust couture editorial portrait" width="2048" height="2048" /></button>
        <button type="button" data-lightbox="/assets/angad-showcase/detail-corrected-03.png"><img src="/assets/angad-showcase/detail-corrected-03.png" alt="Corrected three-quarter rust couture editorial portrait" width="2048" height="2048" /></button>
      </div>
    </section>

    <section class="boutique-stack" aria-labelledby="rust-title">
      <header><span>03</span><h2 id="rust-title">Rust Edit</h2><p>Campaign Stills + Film</p></header>
      <div class="boutique-stack-grid">
        <button type="button" data-lightbox="/assets/angad-showcase/orange-01.png"><img src="/assets/angad-showcase/orange-01.png" alt="Rust and burgundy couture campaign portrait" width="2048" height="2048" /></button>
        <button type="button" data-lightbox="/assets/angad-showcase/orange-02.png"><img src="/assets/angad-showcase/orange-02.png" alt="Rust couture studio portrait" width="2048" height="2048" /></button>
        <button class="boutique-film" type="button" data-video="/assets/angad-showcase/orange-film.mp4" data-video-hevc="/assets/angad-showcase/orange-film-hevc.mp4" aria-label="Play the Rust campaign film"><video muted autoplay loop playsinline preload="metadata" aria-hidden="true"><source src="/assets/angad-showcase/orange-film.mp4" type="video/mp4" /></video><span class="boutique-play"><i>▶</i> Play Film</span></button>
      </div>
    </section>

    <section class="boutique-stack boutique-crimson" aria-labelledby="crimson-title">
      <header><span>04</span><h2 id="crimson-title">Crimson Palace</h2><p>Couture Campaign</p></header>
      <div class="boutique-crimson-showcase">
        <button class="boutique-crimson-hero" type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-04.png"><img src="/assets/angad-showcase/crimson-palace/crimson-04.png" alt="Crimson couture portrait framed by a palace arch" width="2752" height="1536" /></button>
        <div class="boutique-crimson-portraits">
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-01.png"><img src="/assets/angad-showcase/crimson-palace/crimson-01.png" alt="Seated crimson bridal couture portrait inside a heritage palace" width="2048" height="2048" /></button>
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-02.png"><img src="/assets/angad-showcase/crimson-palace/crimson-02.png" alt="Crimson couture back portrait beneath a carved palace arch" width="1536" height="2752" /></button>
        </div>
        <div class="boutique-crimson-grid">
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-03.png"><img src="/assets/angad-showcase/crimson-palace/crimson-03.png" alt="Full-length crimson couture campaign portrait in a palace doorway" width="2400" height="1792" /></button>
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-05.png"><img src="/assets/angad-showcase/crimson-palace/crimson-05.png" alt="Crimson couture editorial portrait beneath a heritage arch" width="2752" height="1536" /></button>
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-06.png"><img src="/assets/angad-showcase/crimson-palace/crimson-06.png" alt="Crimson couture campaign portrait with an extended pose" width="2752" height="1536" /></button>
          <button type="button" data-lightbox="/assets/angad-showcase/crimson-palace/crimson-07.png"><img src="/assets/angad-showcase/crimson-palace/crimson-07.png" alt="Crimson couture campaign portrait in warm palace light" width="2752" height="1536" /></button>
        </div>
      </div>
    </section>

    <footer class="boutique-other"><p>View Other Projects</p><nav aria-label="Other projects"><a href="/work/darzie-couture/">Darzie Couture <span>↗</span></a><a href="/work/jewellery/">Jewellery <span>↗</span></a><a href="/#work">View All <span>↗</span></a></nav></footer>
  </main>
  <div class="piece-view-cursor" aria-hidden="true">View</div>
  <dialog class="piece-lightbox" aria-label="Image preview"><button class="piece-close" type="button" aria-label="Close image">×</button><button class="boutique-arrow boutique-prev" type="button" aria-label="Previous image">←</button><img alt="" /><button class="boutique-arrow boutique-next" type="button" aria-label="Next image">→</button><span class="boutique-counter" aria-live="polite"></span></dialog>
  <dialog class="boutique-video-dialog" aria-label="Campaign film"><button class="piece-close boutique-video-close" type="button" aria-label="Close film">×</button><video controls playsinline preload="metadata"></video></dialog>
  <script>
    const lightbox = document.querySelector('.piece-lightbox');
    const preview = lightbox.querySelector('img');
    const viewCursor = document.querySelector('.piece-view-cursor');
    const galleryButtons = [...document.querySelectorAll('[data-lightbox]')];
    const counter = document.querySelector('.boutique-counter');
    let activeIndex = 0;
    const showImage = (index) => {
      activeIndex = (index + galleryButtons.length) % galleryButtons.length;
      const button = galleryButtons[activeIndex];
      preview.src = button.dataset.lightbox;
      preview.alt = button.querySelector('img').alt;
      counter.textContent = `${String(activeIndex + 1).padStart(2, '0')} / ${String(galleryButtons.length).padStart(2, '0')}`;
    };
    galleryButtons.forEach((button, index) => {
      button.addEventListener('click', () => {
        viewCursor.classList.remove('is-visible');
        showImage(index);
        lightbox.showModal();
      });
      button.addEventListener('pointerenter', () => viewCursor.classList.add('is-visible'));
      button.addEventListener('pointermove', (event) => {
        viewCursor.style.left = `${event.clientX}px`;
        viewCursor.style.top = `${event.clientY}px`;
      });
      button.addEventListener('pointerleave', () => viewCursor.classList.remove('is-visible'));
    });
    document.querySelector('.boutique-prev').addEventListener('click', (event) => { event.stopPropagation(); showImage(activeIndex - 1); });
    document.querySelector('.boutique-next').addEventListener('click', (event) => { event.stopPropagation(); showImage(activeIndex + 1); });
    let pointerStart = 0;
    preview.addEventListener('pointerdown', (event) => { pointerStart = event.clientX; });
    preview.addEventListener('pointerup', (event) => { const delta = event.clientX - pointerStart; if (Math.abs(delta) > 45) showImage(activeIndex + (delta < 0 ? 1 : -1)); });
    document.addEventListener('keydown', (event) => {
      if (!lightbox.open) return;
      if (event.key === 'ArrowLeft') showImage(activeIndex - 1);
      if (event.key === 'ArrowRight') showImage(activeIndex + 1);
      if (event.key === 'Escape') lightbox.close();
    });
    window.addEventListener('scroll', () => viewCursor.classList.remove('is-visible'), { passive: true });
    document.querySelector('.piece-close').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) lightbox.close(); });
    const videoDialog = document.querySelector('.boutique-video-dialog');
    const film = videoDialog.querySelector('video');
    const hevcSupport = film.canPlayType('video/mp4; codecs="hvc1"');
    document.querySelectorAll('[data-video]').forEach((button) => button.addEventListener('click', () => {
      film.src = hevcSupport ? button.dataset.videoHevc : button.dataset.video;
      videoDialog.showModal();
      film.play();
    }));
    const closeFilm = () => { film.pause(); film.removeAttribute('src'); film.load(); videoDialog.close(); };
    document.querySelector('.boutique-video-close').addEventListener('click', closeFilm);
    videoDialog.addEventListener('click', (event) => { if (event.target === videoDialog) closeFilm(); });
  </script>
</body>
</html>
