  <dialog class="jewellery-lightbox" aria-label="Jewellery image preview"><button class="jewellery-lightbox-close" type="button" aria-label="Close image">×</button><button class="jewellery-lightbox-nav jewellery-lightbox-prev" type="button" aria-label="Previous image">←</button><img alt="" /><button class="jewellery-lightbox-nav jewellery-lightbox-next" type="button" aria-label="Next image">→</button></dialog>

  <script>
    const jewelleryDialog = document.querySelector('.jewellery-lightbox');
    const jewelleryPreview = jewelleryDialog.querySelector('img');
    const jewelleryItems = [...document.querySelectorAll('[data-jewellery-image]')];
    let jewelleryIndex = 0;
    const showJewelleryImage = (index) => {
      jewelleryIndex = (index + jewelleryItems.length) % jewelleryItems.length;
      const item = jewelleryItems[jewelleryIndex];
      jewelleryPreview.src = item.dataset.jewelleryImage;
      jewelleryPreview.alt = item.querySelector('img').alt;
    };
    jewelleryItems.forEach((item, index) => item.addEventListener('click', () => { showJewelleryImage(index); jewelleryDialog.showModal(); }));
    jewelleryDialog.querySelector('.jewellery-lightbox-close').addEventListener('click', () => jewelleryDialog.close());
    jewelleryDialog.querySelector('.jewellery-lightbox-prev').addEventListener('click', () => showJewelleryImage(jewelleryIndex - 1));
    jewelleryDialog.querySelector('.jewellery-lightbox-next').addEventListener('click', () => showJewelleryImage(jewelleryIndex + 1));
    jewelleryDialog.addEventListener('click', (event) => { if (event.target === jewelleryDialog) jewelleryDialog.close(); });
    const videoDialog = document.querySelector('.jewellery-video-lightbox');
    const videoPreview = videoDialog.querySelector('video');
    const filmPreviews = [...document.querySelectorAll('.jewellery-film-card video')];
    const playFilm = (video) => { video.muted = true; video.defaultMuted = true; video.playsInline = true; video.preload = 'auto'; const playing = video.play(); if (playing) playing.catch(() => {}); };
    const filmObserver = new IntersectionObserver((entries) => entries.forEach(({ target, isIntersecting }) => { if (isIntersecting) playFilm(target); else target.pause(); }), { rootMargin: '350px 0px' });
    filmPreviews.forEach((video) => filmObserver.observe(video));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) filmPreviews.forEach((video) => { if (!video.paused) playFilm(video); }); });
    document.querySelectorAll('[data-jewellery-video]').forEach((item) => item.addEventListener('click', () => {
      videoPreview.pause();
      videoPreview.src = item.dataset.jewelleryVideo;
      videoPreview.muted = false;
      videoPreview.load();
      videoDialog.showModal();
      const startFilm = () => { const playing = videoPreview.play(); if (playing) playing.catch(() => {}); };
      if (videoPreview.readyState >= 2) startFilm(); else videoPreview.addEventListener('canplay', startFilm, { once: true });
    }));
    const closeVideo = () => { videoPreview.pause(); videoPreview.removeAttribute('src'); videoPreview.load(); videoDialog.close(); };
    videoDialog.querySelector('button').addEventListener('click', closeVideo);
    videoDialog.addEventListener('click', (event) => { if (event.target === videoDialog) closeVideo(); });
  </script>
