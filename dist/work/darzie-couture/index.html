  <div class="piece-view-cursor" aria-hidden="true">View</div>
  <dialog class="piece-lightbox" aria-label="Image preview"><button class="piece-close" type="button" aria-label="Close image">×</button><img alt="" /></dialog>
  <script>
    const lightbox = document.querySelector('.piece-lightbox');
    const preview = lightbox.querySelector('img');
    const viewCursor = document.querySelector('.piece-view-cursor');
    document.querySelectorAll('[data-lightbox]').forEach((button) => {
      button.addEventListener('click', () => {
        viewCursor.classList.remove('is-visible');
        preview.src = button.dataset.lightbox;
        preview.alt = button.querySelector('img').alt;
        lightbox.showModal();
      });
      button.addEventListener('pointerenter', () => viewCursor.classList.add('is-visible'));
      button.addEventListener('pointermove', (event) => {
        viewCursor.style.left = `${event.clientX}px`;
        viewCursor.style.top = `${event.clientY}px`;
      });
      button.addEventListener('pointerleave', () => viewCursor.classList.remove('is-visible'));
    });
    window.addEventListener('scroll', () => viewCursor.classList.remove('is-visible'), { passive: true });
    document.querySelector('.piece-close').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) lightbox.close(); });
  </script>
