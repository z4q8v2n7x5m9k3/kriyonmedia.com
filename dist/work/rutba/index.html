<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Rutba collection campaign by Kriyon Media." />
  <meta name="theme-color" content="#ffffff" />
  <title>Rutba × Kriyon Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=51" />
  <script defer src="/media-guard.js"></script>
</head>
<body class="piece-page ruby-reverie-page rutba-page">
  <main>
    <header class="piece-brandbar piece-collab" aria-label="Project collaboration"><strong>Rutba</strong><span>×</span><a href="/">Kriyon Media</a></header>
    <div class="piece-meta" aria-label="Project details"><p>Collection Campaign</p><p>Engineered by Pixel One</p></div>
    <section class="piece-grid ruby-reverie-grid" aria-label="Rutba collection campaign">
      <div class="ruby-reverie-section-label"><p>Full Shoot</p></div>
      <button class="piece-wide" type="button" data-rutba-image="/assets/pixelone/pixelone-image-158.png"><img src="/assets/pixelone/pixelone-image-158.png" alt="Rutba collection campaign in an architectural setting" loading="eager" decoding="async" /></button>
      <div class="ruby-reverie-row ruby-reverie-square-row">
        <button type="button" data-rutba-image="/assets/pixelone/pixelone-image-154.png"><img src="/assets/pixelone/pixelone-image-154.png" alt="Rutba full-length collection portrait" loading="eager" decoding="async" /></button>
        <button type="button" data-rutba-image="/assets/pixelone/pixelone-image-157.png"><img src="/assets/pixelone/pixelone-image-157.png" alt="Rutba collection look with flowing dupatta" loading="eager" decoding="async" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-square-row">
        <button type="button" data-rutba-image="/assets/pixelone/pixelone-image-155.png"><img src="/assets/pixelone/pixelone-image-155.png" alt="Rutba collection look beneath an arched doorway" loading="lazy" decoding="async" /></button>
        <button type="button" data-rutba-image="/assets/pixelone/pixelone-image-156.png"><img src="/assets/pixelone/pixelone-image-156.png" alt="Rutba collection embroidery portrait" loading="lazy" decoding="async" /></button>
      </div>
      <button class="piece-wide" type="button" data-rutba-image="/assets/pixelone/pixelone-image-153.png"><img src="/assets/pixelone/pixelone-image-153.png" alt="Rutba emerald and gold embroidery detail" loading="lazy" decoding="async" /></button>
    </section>
    <footer class="piece-other"><p>View Other Projects</p><nav aria-label="Other projects"><a href="/work/darzie-couture/">Darzie Couture <span>↗</span></a><a href="/work/red-jewellery/">Ruby Reverie <span>↗</span></a><a href="/work/">View All <span>↗</span></a></nav></footer>
  </main>
  <dialog class="piece-lightbox" aria-label="Image preview"><button class="piece-close" type="button" aria-label="Close image">×</button><img alt="" /></dialog>
  <script>
    const dialog = document.querySelector('.piece-lightbox'); const preview = dialog.querySelector('img');
    document.querySelectorAll('[data-rutba-image]').forEach((button) => button.addEventListener('click', () => { preview.src = button.dataset.rutbaImage; preview.alt = button.querySelector('img').alt; dialog.showModal(); }));
    dialog.querySelector('.piece-close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
