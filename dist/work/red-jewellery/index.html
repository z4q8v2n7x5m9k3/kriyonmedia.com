<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Ruby Reverie jewellery campaign by Kriyon Media." />
  <meta name="theme-color" content="#ffffff" />
  <title>Ruby Reverie — Kriyon Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=49" />
</head>
<body class="piece-page ruby-reverie-page">
  <main>
    <header class="piece-brandbar piece-collab" aria-label="Project collaboration"><strong>Ruby Reverie</strong><span>×</span><a href="/">Kriyon Media</a></header>
    <div class="piece-meta" aria-label="Project details"><p>Jewellery Showcase</p><p>Engineered by Pixel One</p></div>
    <section class="piece-grid ruby-reverie-grid" aria-label="Ruby Reverie jewellery campaign">
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-close.png"><img src="/assets/red-jewellery/ruby-necklace-close.png" alt="Ruby and diamond floral necklace close-up" /></button>
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-wide-detail.png"><img src="/assets/red-jewellery/ruby-necklace-wide-detail.png" alt="Ruby and diamond jewellery campaign detail" /></button>
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-02.png"><img src="/assets/red-jewellery/ruby-portrait-02.png" alt="Ruby jewellery campaign portrait in a maroon saree" /></button>
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-wide.png"><img src="/assets/red-jewellery/ruby-necklace-wide.png" alt="Ruby and diamond necklace against maroon occasion wear" /></button>
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-01.png"><img src="/assets/red-jewellery/ruby-portrait-01.png" alt="Model wearing ruby jewellery in a red sari" /></button>
      <button class="piece-portrait" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-detail.png"><img src="/assets/red-jewellery/ruby-necklace-detail.png" alt="Detailed ruby diamond necklace" /></button>
      <button class="piece-portrait" type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-03.png"><img src="/assets/red-jewellery/ruby-portrait-03.png" alt="Full-length red saree portrait" /></button>
      <button class="piece-portrait" type="button" data-ruby-image="/assets/red-jewellery/ruby-social-portrait.png"><img src="/assets/red-jewellery/ruby-social-portrait.png" alt="Ruby jewellery campaign portrait" /></button>
      <button class="piece-portrait" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-shadow.png"><img src="/assets/red-jewellery/ruby-necklace-shadow.png" alt="Ruby necklace in dramatic shadow" /></button>
      <button class="piece-wide" type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-04.png"><img src="/assets/red-jewellery/ruby-portrait-04.png" alt="Red saree portrait for the ruby jewellery campaign" /></button>
    </section>
    <footer class="piece-other"><p>View Other Projects</p><nav aria-label="Other projects"><a href="/work/jewellery/">Jewellery <span>↗</span></a><a href="/work/clothing/">Clothing &amp; Boutiques <span>↗</span></a><a href="/work/">View All <span>↗</span></a></nav></footer>
  </main>
  <dialog class="piece-lightbox" aria-label="Image preview"><button class="piece-close" type="button" aria-label="Close image">×</button><img alt="" /></dialog>
  <script>
    const dialog = document.querySelector('.piece-lightbox'); const preview = dialog.querySelector('img');
    document.querySelectorAll('[data-ruby-image]').forEach((button) => button.addEventListener('click', () => { preview.src = button.dataset.rubyImage; preview.alt = button.querySelector('img').alt; dialog.showModal(); }));
    dialog.querySelector('.piece-close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
