<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Ruby Reverie jewellery campaign by Kriyon Media." />
  <meta name="theme-color" content="#ffffff" />
  <title>Ruby Reverie — Kriyon Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=48" />
</head>
<body class="ruby-reverie-page">
  <main>
    <header class="ruby-reverie-collab" aria-label="Project collaboration"><strong>Ruby Reverie</strong><span>×</span><a href="/">Kriyon Media</a></header>
    <section class="ruby-reverie-gallery" aria-label="Ruby Reverie jewellery campaign">
      <button class="ruby-reverie-full" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-wide.png"><img src="/assets/red-jewellery/ruby-necklace-wide.png" alt="Ruby and diamond necklace against maroon occasion wear" /></button>
      <div class="ruby-reverie-pair"><button type="button" data-ruby-image="/assets/red-jewellery/ruby-social-portrait.png"><img src="/assets/red-jewellery/ruby-social-portrait.png" alt="Ruby jewellery campaign portrait" /></button><button type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-close.png"><img src="/assets/red-jewellery/ruby-necklace-close.png" alt="Ruby and diamond floral necklace close-up" /></button></div>
      <div class="ruby-reverie-trio"><button type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-01.png"><img src="/assets/red-jewellery/ruby-portrait-01.png" alt="Model wearing ruby jewellery in a red sari" /></button><button type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-detail.png"><img src="/assets/red-jewellery/ruby-necklace-detail.png" alt="Detailed ruby diamond necklace" /></button><button type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-04.png"><img src="/assets/red-jewellery/ruby-portrait-04.png" alt="Red saree portrait for the ruby jewellery campaign" /></button></div>
      <button class="ruby-reverie-full" type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-wide-detail.png"><img src="/assets/red-jewellery/ruby-necklace-wide-detail.png" alt="Ruby and diamond jewellery campaign detail" /></button>
      <div class="ruby-reverie-pair"><button type="button" data-ruby-image="/assets/red-jewellery/ruby-necklace-shadow.png"><img src="/assets/red-jewellery/ruby-necklace-shadow.png" alt="Ruby necklace in dramatic shadow" /></button><button type="button" data-ruby-image="/assets/red-jewellery/ruby-portrait-03.png"><img src="/assets/red-jewellery/ruby-portrait-03.png" alt="Full-length red sari portrait" /></button></div>
    </section>
    <footer class="ruby-reverie-footer"><a href="/work/">Explore Portfolio <span>↗</span></a><a href="/work/jewellery/">Jewellery Showcase <span>↗</span></a></footer>
  </main>
  <dialog class="ruby-reverie-lightbox" aria-label="Image preview"><button class="ruby-reverie-close" type="button" aria-label="Close image">×</button><img alt="" /></dialog>
  <script>
    const dialog = document.querySelector('.ruby-reverie-lightbox'); const preview = dialog.querySelector('img');
    document.querySelectorAll('[data-ruby-image]').forEach((button) => button.addEventListener('click', () => { preview.src = button.dataset.rubyImage; preview.alt = button.querySelector('img').alt; dialog.showModal(); }));
    dialog.querySelector('.ruby-reverie-close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
