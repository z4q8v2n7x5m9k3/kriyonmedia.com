<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Ruby Reverie jewellery campaign by Kriyon Media." />
  <meta name="theme-color" content="#ffffff" />
  <title>Ruby Reverie — Kriyon Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=50" />
  <script defer src="/media-guard.js"></script>
</head>
<body class="piece-page ruby-reverie-page">
  <main>
    <header class="piece-brandbar piece-collab" aria-label="Project collaboration"><strong>Ruby Reverie</strong><span>×</span><a href="/">Kriyon Media</a></header>
    <div class="piece-meta" aria-label="Project details"><p>Jewellery Showcase</p><p>Engineered by Pixel One</p></div>
    <section class="piece-grid ruby-reverie-grid" aria-label="Ruby Reverie jewellery campaign">
      <div class="ruby-reverie-row ruby-reverie-landscape-row">
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-127.png"><img src="/assets/pixelone/pixelone-image-127.png" alt="Model wearing ruby jewellery in a red sari" /></button>
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-126.png"><img src="/assets/pixelone/pixelone-image-126.png" alt="Ruby and diamond necklace against maroon occasion wear" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-square-row">
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-131.png"><img src="/assets/pixelone/pixelone-image-131.png" alt="Ruby jewellery campaign portrait" /></button>
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-123.png"><img src="/assets/pixelone/pixelone-image-123.png" alt="Detailed ruby diamond necklace" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-portrait-row">
        <button class="piece-portrait" type="button" data-ruby-image="/assets/pixelone/pixelone-image-151.png"><img src="/assets/pixelone/pixelone-image-151.png" alt="Radiant Rubies ready-to-post jewellery creative" loading="lazy" decoding="async" /></button>
        <button class="piece-portrait" type="button" data-ruby-image="/assets/pixelone/pixelone-image-152.png"><img src="/assets/pixelone/pixelone-image-152.png" alt="Timeless Gemstones ready-to-post jewellery creative" loading="lazy" decoding="async" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-leading-row">
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-122.png"><img src="/assets/pixelone/pixelone-image-122.png" alt="Ruby and diamond floral necklace close-up" /></button>
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-128.png"><img src="/assets/pixelone/pixelone-image-128.png" alt="Ruby jewellery campaign portrait in a maroon saree" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-square-row">
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-124.png"><img src="/assets/pixelone/pixelone-image-124.png" alt="Ruby necklace in dramatic shadow" /></button>
        <button type="button" data-ruby-image="/assets/pixelone/pixelone-image-125.png"><img src="/assets/pixelone/pixelone-image-125.png" alt="Ruby and diamond jewellery campaign detail" /></button>
      </div>
      <div class="ruby-reverie-row ruby-reverie-portrait-row">
        <button class="piece-portrait" type="button" data-ruby-image="/assets/pixelone/pixelone-image-129.png"><img src="/assets/pixelone/pixelone-image-129.png" alt="Full-length red saree portrait" /></button>
        <button class="piece-portrait" type="button" data-ruby-image="/assets/pixelone/pixelone-image-130.png"><img src="/assets/pixelone/pixelone-image-130.png" alt="Red saree portrait for the ruby jewellery campaign" /></button>
      </div>
    </section>
    <footer class="piece-other"><p>View Other Projects</p><nav aria-label="Other projects"><a href="/work/jewellery/">Jewellery <span>↗</span></a><a href="/work/clothing/">Clothing &amp; Boutiques <span>↗</span></a><a href="/work/">View All <span>↗</span></a></nav></footer>
  </main>
  <dialog class="piece-lightbox" aria-label="Image preview"><button class="piece-close" type="button" aria-label="Close image">×</button><img alt="" /></dialog>
  <script>
    const dialog = document.querySelector('.piece-lightbox'); const preview = dialog.querySelector('img');
    document.querySelectorAll('[data-ruby-image]').forEach((button) => button.addEventListener('click', () => { preview.src = button.dataset.rubyImage; preview.alt = button.querySelector('img').alt; dialog.showModal(); }));
    dialog.querySelector('.piece-close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
